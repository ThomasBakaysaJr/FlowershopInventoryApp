name: CI Pipeline

# Trigger on push to main or any pull request
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip' # Caches dependencies to make runs faster

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Audit Dependencies
      run: |
        # Fail the build on a known CVE in a runtime dependency.
        pip-audit -r requirements.txt

    - name: Security Scan
      run: |
        # Application code only; -ll limits to medium/high severity.
        bandit -r src/ -ll

    - name: Lint with Ruff
      run: |
        # Full ruleset, configured in pyproject.toml.
        ruff check .

    - name: Run Tests
      run: |
        pytest -v tests/
