name: CI Pipeline

# Trigger on push to main or any pull request
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Lint and test across the supported Python range. The 3.11 leg exists to
  # prove the floor declared in pyproject.toml (requires-python) is real.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Lint with Ruff
      run: |
        # Full ruleset; lint target is inferred from requires-python.
        ruff check .

    - name: Run Tests
      run: |
        pytest -v tests/

  # Supply-chain and static security checks. Not version-dependent, so this
  # runs once rather than duplicating across the matrix.
  security:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Audit Dependencies
      run: |
        # Fail the build on a known CVE in a runtime dependency.
        pip-audit -r requirements.txt

    - name: Security Scan
      run: |
        # Application code only; -ll limits to medium/high severity.
        bandit -r src/ -ll
